name: Secret scan

# GitHub's own secret scanning is not available here. The API says so plainly:
#
#     Secret scanning is disabled on this repository.
#
# It needs GitHub Secret Protection, which is paid, on a private repository.
# Rather than leave that check permanently unavailable on a repo that holds
# real keys, this runs an open-source scanner on every push and PR. Free, and
# it catches a secret BEFORE it reaches main rather than alerting after.
#
# --only-verified is deliberate. Unverified matches are mostly example keys,
# test fixtures and base64 that happens to look like a token, and a scanner
# that cries wolf gets switched off within a fortnight. Verified means
# TruffleHog actually proved the credential is live against its provider. A
# hit here is a key to rotate right now, not a thing to triage.
#
# Agent Wisdom reads the result of this workflow in place of GitHub's feature,
# so the "No leaked secrets detected" check has a real subject again.
#
# This repository earns it: it is PUBLIC, app/index.html is bring-your-own-key
# against the Anthropic Messages API, and the site also talks to CoinGecko,
# DefiLlama, the Fear and Greed index and this project's own Cloudflare Worker.
# Checked by hand on 2026-10-12 and nothing is embedded, the three sk-ant
# strings being a placeholder, a label and a comment. This workflow is what
# keeps that true after the next edit.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history. A shallow clone only sees the tip, and a key that was
          # committed and then "removed" in a later commit is still sitting in
          # the history for anyone who clones. That is the case this is for.
          fetch-depth: 0

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
